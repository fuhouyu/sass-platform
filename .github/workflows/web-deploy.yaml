name: web-deploy
on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - develop
  pull_request_target:
    branches: [ develop ]
permissions: read-all

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
      - name: "Cache Npm Repos"
        uses: actions/cache@v4
        with:
          path: ~/.npm/repository
          key: ${{ runner.os }}-package-${{ hashFiles('**/package.json') }}
          restore-keys: |
            ${{ runner.os }}-package-

      - uses: actions/checkout@v4
        name: Checkout Sass Platform repository
        with:
          fetch-depth: 0
      - name: Npm build
        run: |
          npm install && npm run build
      - name: Scp dist File
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          source: "dist/"
          target: "/develop/projects/web/static"
          strip_components: 1